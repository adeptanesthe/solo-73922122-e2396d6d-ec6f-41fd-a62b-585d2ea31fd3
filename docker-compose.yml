name: lab-snapshot

# 两个服务进程（app1/app2）共享同一个 SQLite 数据库文件（命名卷 labdata），
# 用于演示并发写入、开启快照与翻页时快照语义依然成立。
services:
  app1:
    build:
      context: .
      target: runtime
    image: lab-snapshot-api:latest
    environment:
      RESULTS_DB: /data/results.db
    volumes:
      - labdata:/data
    ports:
      - "8001:8000"
    restart: unless-stopped

  app2:
    build:
      context: .
      target: runtime
    image: lab-snapshot-api:latest
    environment:
      RESULTS_DB: /data/results.db
    volumes:
      - labdata:/data
    ports:
      - "8002:8000"
    restart: unless-stopped

  # 只在显式启用 test profile 时运行：
  # docker compose --profile test run --rm tests
  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    image: lab-snapshot-api-test:latest
    command: ["pytest", "-q"]

volumes:
  labdata:
